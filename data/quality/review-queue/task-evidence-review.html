<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<title>Task Evidence Review</title>
<style>
body{font:14px system-ui;max-width:1100px;margin:32px auto;padding:0 16px;background:#f7f8fa;color:#1f2937}header,article{background:#fff;border:1px solid #d1d5db;border-radius:10px;padding:18px;margin:14px 0}.task{border-top:1px solid #e5e7eb;padding:16px 0}.context{white-space:pre-wrap;background:#f3f4f6;padding:10px;border-radius:6px}label{display:block;font-weight:600;margin:10px 0 4px}input,select,textarea{width:100%;box-sizing:border-box;padding:7px}textarea{min-height:56px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.warn{color:#991b1b}.ok{color:#166534}button{padding:9px 14px;margin:12px 6px 0 0}small{color:#4b5563}
</style>
<header><h1>Task Evidence Review</h1><p>Nạp file queue JSONL do script export tạo ra. Mỗi task phải xác nhận action span, authority, owner và deadline trực tiếp từ transcript context.</p><input id="file" type="file" accept=".jsonl,.txt"><button id="download" disabled>Tải reviewed JSONL</button><p id="state" class="warn">Chưa nạp queue.</p></header>
<main id="tasks"></main>
<script>
let rows=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function field(row,key,label,placeholder=''){return `<label>${label}</label><input data-key="${key}" value="${esc(row[key]||'')}" placeholder="${placeholder}">`}
function render(){const root=document.querySelector('#tasks');root.innerHTML=rows.map((r,i)=>{const ctx=(r.contexts||[]).flat().map(c=>`[${c.clause_id}] ${c.speaker_name||''}: ${c.text_raw||''}`).join('\n');return `<article class="task" data-index="${i}"><h2>${esc(r.case_id)} · task #${r.expected_task_index}</h2><p><b>Expected:</b> ${esc(r.expected_task.task_name)} — ${esc(r.expected_task.assignee||'unassigned')}</p><div class="context">${esc(ctx)}</div><small>Suggested clauses: ${esc((r.suggested_clause_ids||[]).join(', '))}. Đây chỉ là gợi ý, không phải ground truth.</small><div class="row">${field(r,'reviewer','Reviewer')} ${field(r,'reviewed_at','Reviewed at (ISO)','2026-08-25T10:00:00+07:00')}</div><div class="row">${field(r,'action_clause_id','Action clause ID')} ${field(r,'action_text','Exact action text')}</div><div class="row">${field(r,'action_start','Action start offset')} ${field(r,'action_end','Action end offset')}</div><div class="row">${field(r,'authority_clause_id','Authority clause ID')} ${field(r,'authority_type','Authority type','DIRECT_ASSIGNMENT / EXPLICIT_ACCEPTANCE / SELF_COMMITMENT')}</div><div class="row">${field(r,'owner_clause_id','Owner clause ID')} ${field(r,'owner_participant','Owner participant')}</div><div class="row">${field(r,'deadline_clause_id','Deadline clause ID')} ${field(r,'deadline_mention_id','Deadline mention ID')}</div><label>Proposal kind</label><select data-key="proposal_kind"><option>CREATE</option><option>UPDATE</option><option>REFERENCE</option></select><label>Review note / negative context</label><textarea data-key="review_note">${esc(r.review_note||'')}</textarea></article>`}).join('');document.querySelector('#download').disabled=!rows.length;document.querySelector('#state').textContent=`Đã nạp ${rows.length} task. Chỉ export các row đã điền đủ evidence.`;document.querySelector('#state').className='ok'}
document.querySelector('#file').onchange=async e=>{rows=(await e.target.files[0].text()).split(/\r?\n/).filter(Boolean).map(JSON.parse);render()};
document.querySelector('#download').onclick=()=>{for(const article of document.querySelectorAll('.task')){const r=rows[+article.dataset.index];article.querySelectorAll('[data-key]').forEach(x=>r[x.dataset.key]=x.value);r.review_status='HUMAN_CONFIRMED';r.review_basis='TRANSCRIPT_AUDIT'}const blob=new Blob([rows.map(JSON.stringify).join('\n')+'\n'],{type:'application/jsonl'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='task-evidence-reviewed.jsonl';a.click()};
</script>
</html>
